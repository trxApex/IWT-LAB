    <title>A5</title>
    <script>
        let arr = [12, 4, 6, 7, 9, 31, 24 , 53, 90];
        let evenarray = [];
        let oddarray = [];
        for(let num of arr) {
            if(num % 2 == 0) {
                evenarray.push(num);
            }
            else {
                oddarray.push(num);
            }
        }
        console.log(evenarray);
        console.log(oddarray);
    </script>
