<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body, html {
            margin: 0;
            height: 100%;
        }
        .container {
            display: grid;
            height: 100px;
        }
        .quadrant {
            display: flex;
            align-items: center;
            border: 2px;
        }
    </style>
    <script>
        function abc() {
            let a = document.getElementById("x").value;
            if (a == "red") document.bgColor = "red";
            else if (a == "green") document.bgColor = "green";
            else if (a == "blue") document.bgColor = "blue";
            else if (a == "yellow") document.bgColor = "yellow";
            else if (a == "none") document.bgColor = "white";
        }
        function abcd() {
            let a = document.getElementById("y").value;
            if (a == "red") document.bgColor = "red";
            else if (a == "green") document.bgColor = "green";
            else if (a == "blue") document.bgColor = "blue";
            else if (a == "yellow") document.bgColor = "yellow";
            else if (a == "none") document.bgColor = "white";
        }
        function abcde() {
            let a = document.getElementById("z").value;
            if (a == "red") document.bgColor = "red";
            else if (a == "green") document.bgColor = "green";
            else if (a == "blue") document.bgColor = "blue";
            else if (a == "yellow") document.bgColor = "yellow";
            else if (a == "none") document.bgColor = "white";
        }
        function abcdef() {
            let a = document.getElementById("t").value;
            if (a == "red") document.bgColor = "red";
            else if (a == "green") document.bgColor = "green";
            else if (a == "blue") document.bgColor = "blue";
            else if (a == "yellow") document.bgColor = "yellow";
            else if (a == "none") document.bgColor = "white";
        }

    </script>
</head>

<body>
    <div class="container">
        <div class="quadrant" style="background:white;">topleft
            <select id="x" onchange="abc()">
                <option value="none">none</option>
                <option value="red">red</option>
                <option value="green">green</option>
                <option value="yellow">yellow</option>
                <option value="blue">blue</option>
            </select>
        </div>
        <div class="quadrant" style="background:white;">top right
            <select id="y" onchange="abcd()">
                <option value="none">none</option>
                <option value="red">red</option>
                <option value="green">green</option>
                <option value="yellow">yellow</option>
                <option value="blue">blue</option>
            </select>
        </div>

        <div class="quadrant" style="background:white;">bottomleft
            <select id="z" onchange="abcde()">
                <option value="none">none</option>
                <option value="red">red</option>
                <option value="green">green</option>
                <option value="yellow">yellow</option>
                <option value="blue">blue</option>
            </select>
        </div>

        <div class="quadrant" style="background:white;">bottom right
            <select id="t" onchange="abcdef()">
                <option value="none">none</option>
                <option value="red">red</option>
                <option value="green">green</option>
                <option value="yellow">yellow</option>
                <option value="blue">blue</option>
            </select>
        </div>
    </div>

</body>

</html>
