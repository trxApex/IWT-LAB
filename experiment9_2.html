<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Section - Flexbox</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 40px;
            color: #333;
        }
        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .product-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            flex: 1;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .product-card h3 {
            font-size: 1.25rem;
            margin: 10px 0;
        }
        .product-card p {
            font-size: 1.1rem;
            color: #666;
            font-weight: bold;
        }
        .product-card button {
            background-color: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
        }
        .product-card button:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <h1 class="section-title">Featured Products</h1>
    <div class="product-container">
        <div class="product-card">
            <img src="img/smartphones.jpg" alt="Smartphone">
            <h3>Smartphone X</h3>
            <p>$699.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="img/wirelessbuds.jpg" alt="Wireless Headphones">
            <h3>Wireless Buds</h3>
            <p>$149.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="img/smartwatch.jpg" alt="Smart Watch">
            <h3>Smart Watch 5</h3>
            <p>$299.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="img/laptopbag.jpg" alt="Laptop Bag">
            <h3>Pro Laptop Bag</h3>
            <p>$75.00</p>
            <button>Add to Cart</button>
        </div>
    </div>

</body>
</html>
