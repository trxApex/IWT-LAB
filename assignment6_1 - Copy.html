<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
      function changeText() {
        document.getElementById('myHeading').innerText = "Welcome to DOM Manipulation";
      }
    </script>
</head>
<body>
    <h2 id="myHeading">Hello World</h2>
    <button onclick="changeText()">Change Text</button>
</body>
</html>
