<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function checkPrime(event) {
        const n = parseInt(document.getElementById('numInput').value);
        let isPrime = n > 1;
    
        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
            isPrime = false;
            break;
            }
        }
        alert(isPrime ? `${n} is a prime number!` : `${n} is not a prime number.`);
        }
    </script>
</head>
<body>
    <form onsubmit="checkPrime(event)">
        <input type="number" id="numInput" placeholder="Enter a number" required>
        <button type="submit">Check Prime</button>
    </form>
</body>
</html>
