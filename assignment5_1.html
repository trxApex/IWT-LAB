<!-- 1. Write a program using if-else to assign grades based on marks: >=90 ? Grade A; >=75 ?
Grade B; >=50 ? Grade C; <50 ? Fail -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT 5</title>
    <script>
        var marks = 89.34;
        if(marks >= 90) {
            console.log("Grade A")
        }
        else if (marks >= 75) {
            console.log("Grade B");
        }
        else if (marks >= 50) {
            console.log("Grade c");
        }
        else {
            console.log("Fail!!");
        }
    </script>
</head>
<body bgcolor="pink", text="blue">
</body>
</html>
